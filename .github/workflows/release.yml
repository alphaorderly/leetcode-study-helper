name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main. Aborting release."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build VSIX
        uses: coactions/setup-xvfb@v1
        with:
          run: yarn package:vsix

      - name: Prepare release asset
        run: |
          mv .artifacts/leetcode-study-helper.vsix \
            ".artifacts/leetcode-study-helper-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .artifacts/leetcode-study-helper-${{ github.ref_name }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
