name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ github.ref_name }}
      RELEASE_ASSET: .artifacts/leetcode-study-helper-${{ github.ref_name }}.vsix
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Validate release tag
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "${TAG_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${TAG_NAME} does not match package.json version ${package_version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

          git fetch origin main
          tag_commit="$(git rev-list -n 1 "${TAG_NAME}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag ${TAG_NAME} is not on main. Aborting release."
            exit 1
          fi

          echo "RELEASE_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: xvfb-run --auto-servernum yarn test

      - name: Build VSIX
        run: yarn vsce package --allow-missing-repository --out "${RELEASE_ASSET}"

      - name: Verify VSIX version
        run: |
          set -euo pipefail

          packaged_version="$(unzip -p "${RELEASE_ASSET}" extension/package.json |
            node -e "const fs = require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync(0, 'utf8')).version);")"
          if [ "${packaged_version}" != "${RELEASE_VERSION}" ]; then
            echo "VSIX version ${packaged_version} does not match release version ${RELEASE_VERSION}."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.RELEASE_ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true
